name: CI
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # shortcut: Node and static sites only; add a step here when a project uses another stack.
      - name: Node project
        if: hashFiles('package.json') != ''
        # The Yjs runtime fails fast at import without these; build never connects with them.
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present
      - name: Static site syntax check
        if: hashFiles('package.json') == ''
        run: git ls-files '*.js' | xargs -r -n1 node --check
